name: 🐛 Bug Report
description: Report a bug or unexpected behavior in a script
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please fill out the information below to help us investigate.

  - type: dropdown
    id: script-category
    attributes:
      label: Script Category
      description: Which category does the affected script belong to?
      options:
        - advanced-security
        - api-management
        - cloud-infrastructure
        - container-management
        - database
        - device-management
        - devops-cicd
        - email-services
        - infrastructure-as-code
        - intune
        - linux-server
        - m365
        - monitoring
        - network-management
        - print-management
        - security-compliance
        - server
        - utilities
        - virtualization
        - web-services
        - AzureVirtualDesktop
        - Other
    validations:
      required: true

  - type: input
    id: script-name
    attributes:
      label: Script Name
      description: What is the name of the script with the issue?
      placeholder: "Monitor-ServerHealth.ps1"
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "The script fails when..."
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run the script with parameters...
        2. See error...
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "The script should..."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: "Instead, the script..."
    validations:
      required: true

  - type: textarea
    id: error-message
    attributes:
      label: Error Message
      description: If applicable, paste the full error message here
      placeholder: |
        Error message or stack trace...
      render: powershell

  - type: dropdown
    id: powershell-version
    attributes:
      label: PowerShell Version
      description: What version of PowerShell are you using?
      options:
        - PowerShell 5.1
        - PowerShell 7.0
        - PowerShell 7.1
        - PowerShell 7.2
        - PowerShell 7.3
        - PowerShell 7.4
        - PowerShell 7.5+
        - Other
    validations:
      required: true

  - type: dropdown
    id: os-version
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - Windows 10
        - Windows 11
        - Windows Server 2016
        - Windows Server 2019
        - Windows Server 2022
        - Windows Server 2025
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Any additional environment information (modules installed, domain vs workgroup, etc.)
      placeholder: |
        - Az module version: 10.0.0
        - Domain-joined: Yes
        - Running as: Administrator

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (screenshots, logs, etc.)

  - type: checkboxes
    id: testing
    attributes:
      label: Testing Checklist
      description: Have you tested in a non-production environment?
      options:
        - label: I have tested this in a non-production environment
        - label: I have reviewed the script code for obvious issues
        - label: I have checked the script prerequisites and requirements
