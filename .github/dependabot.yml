version: 2
updates:
  # GitHub Actions: weekly dependency updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # NuGet: no NuGet dependencies are tracked in this repository.
  # Kept as an explicit no-op so the intent is documented; Dependabot
  # will simply find nothing to update here.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
