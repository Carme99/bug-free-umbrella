name: Close Stale Issues

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual triggering

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Manage Stale Issues and PRs
        uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issue configuration
          stale-issue-message: |
            👋 This issue has been inactive for 60 days and will be automatically closed in 7 days unless there is new activity.

            As this is a solo project maintained with Claude Code, I appreciate your patience! If this issue is still relevant, please comment to keep it open.
          close-issue-message: |
            🔒 This issue was automatically closed due to inactivity. Feel free to reopen if needed!
          days-before-issue-stale: 60
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security,help-wanted,good-first-issue'

          # PR configuration
          stale-pr-message: |
            👋 This pull request has been inactive for 30 days and will be automatically closed in 7 days unless there is new activity.

            If you're still working on this, please comment to keep it open. Otherwise, feel free to reopen when ready!
          close-pr-message: |
            🔒 This PR was automatically closed due to inactivity. Feel free to reopen when ready to continue!
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          exempt-pr-labels: 'pinned,security,work-in-progress'

          # General configuration
          operations-per-run: 100
          remove-stale-when-updated: true
          ascending: false
