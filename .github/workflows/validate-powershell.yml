name: Validate PowerShell Scripts

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          # Keep PSGallery Untrusted; install only the required module for the current user
          Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $scriptsPath = './scripts'

          if (-not (Test-Path $scriptsPath)) {
            Write-Host "Scripts path '$scriptsPath' does not exist. Nothing to analyze." -ForegroundColor Yellow
            exit 0
          }

          # Show module version
          try {
            $mod = Get-Module -ListAvailable PSScriptAnalyzer | Sort-Object Version -Descending | Select-Object -First 1
            if ($mod) { Write-Host "PSScriptAnalyzer version: $($mod.Version)" -ForegroundColor Gray }
          } catch {
            Write-Host "Failed to get module version: $($_.Exception.Message)" -ForegroundColor Yellow
          }

          # Run analyzer with curated settings from .vscode
          Write-Host "Running PSScriptAnalyzer with curated settings (.vscode/PSScriptAnalyzerSettings.psd1)..." -ForegroundColor Cyan

          # Curated settings contract: local .vscode/PSScriptAnalyzerSettings.psd1 and CI must stay in sync on this.
          $psaSettings = './.vscode/PSScriptAnalyzerSettings.psd1'
          if (-not (Test-Path $psaSettings)) {
            Write-Host "Settings file '$psaSettings' not found. Cannot run analyzer." -ForegroundColor Red
            exit 1
          }

          $invokeArgs = @{
            Path = $scriptsPath
            Recurse = $true
            Settings = $psaSettings
          }

          try {
            $results = Invoke-ScriptAnalyzer @invokeArgs -ErrorAction Stop
          } catch {
            Write-Host "Invoke-ScriptAnalyzer failed: $($_.Exception.Message)" -ForegroundColor Red
            $_.Exception | Format-List * -Force

            # Fall back to per-file analysis
            Write-Host "`nFalling back to per-file analysis..." -ForegroundColor Yellow
            $files = Get-ChildItem -Path $scriptsPath -Filter *.ps1 -Recurse
            $allResults = @()
            foreach ($f in $files) {
              try {
                Write-Host "Analyzing: $($f.FullName)" -ForegroundColor Gray
                $r = Invoke-ScriptAnalyzer -Path $f.FullName -Settings $psaSettings -ErrorAction Stop
                if ($r) { $allResults += $r }
              } catch {
                Write-Host "ERROR analyzing $($f.FullName): $($_.Exception.Message)" -ForegroundColor Red
                Write-Host "Skipping this file and continuing..." -ForegroundColor Yellow
                # Don't throw - just continue to next file
              }
            }
            $results = $allResults
          }

          # Handle results (null/empty-safe) - GATING: fail on any Error severity
          if ($null -ne $results -and $results.Count -gt 0) {
            $results | Format-Table -AutoSize
            Write-Host "`nPSScriptAnalyzer found $($results.Count) issue(s)" -ForegroundColor Yellow

            $errors = $results | Where-Object Severity -eq 'Error'
            $warnings = $results | Where-Object Severity -eq 'Warning'

            Write-Host "Errors: $($errors.Count)" -ForegroundColor Yellow
            Write-Host "Warnings: $($warnings.Count)" -ForegroundColor Yellow

            if ($errors.Count -gt 0) {
              Write-Host "`nShowing first 10 errors:" -ForegroundColor Yellow
              $errors | Select-Object -First 10 | Format-Table RuleName, ScriptName, Line, Message -AutoSize
              Write-Host "PSScriptAnalyzer found $($errors.Count) error(s). Failing the pipeline." -ForegroundColor Red
              exit 1
            }
          } else {
            Write-Host "No issues found by PSScriptAnalyzer!" -ForegroundColor Green
          }

      - name: Enforce policy rules (comment-based help, style, ShouldProcess)
        shell: pwsh
        run: |
          $settings = @{
            Severity = @('Error', 'Warning', 'Information')
            Rules = @{
              PSUseConsistentIndentation = @{ Enable = $true }
              PSUseConsistentWhitespace  = @{ Enable = $true }
              PSPlaceOpenBrace           = @{ Enable = $true }
              PSPlaceCloseBrace          = @{ Enable = $true }
              PSUseCorrectCasing         = @{ Enable = $true }
            }
            IncludeRules = @(
              'PSUseConsistentIndentation', 'PSUseConsistentWhitespace',
              'PSPlaceOpenBrace', 'PSPlaceCloseBrace', 'PSUseCorrectCasing',
              'PSShouldProcess', 'PSUseShouldProcessForStateChangingFunctions',
              'PSUseSupportsShouldProcess'
            )
          }
          $policyFindings = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings $settings
          if ($policyFindings) {
            $policyFindings | Format-Table RuleName, ScriptName, Line, Message -AutoSize
            Write-Host "Policy enforcement found $($policyFindings.Count) finding(s). Failing the pipeline." -ForegroundColor Red
            exit 1
          }
          Write-Host "Policy enforcement passed (help/style/ShouldProcess)." -ForegroundColor Green

      - name: Enforce comment-based help (SYNOPSIS presence)
        shell: pwsh
        run: |
          $missing = @()
          Get-ChildItem -Path ./scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $content = Get-Content -LiteralPath $_.FullName -Raw
            if ($content -and $content -notmatch '\.SYNOPSIS') { $missing += $_.FullName }
          }
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Host "MISSING .SYNOPSIS: $_" -ForegroundColor Red }
            Write-Host "$($missing.Count) script(s) missing comment-based help. Failing the pipeline." -ForegroundColor Red
            exit 1
          }
          Write-Host "Comment-based help present in all scripts." -ForegroundColor Green

      - name: Upload Analysis Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pssa-results
          path: |
            *.sarif
            *.xml

  syntax-check:
    name: PowerShell Syntax Validation
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PowerShell Syntax
        shell: pwsh
        run: |
          $errors = @()

          Get-ChildItem -Path ./scripts -Filter *.ps1 -Recurse | ForEach-Object {
            Write-Host "Checking: $($_.FullName)" -ForegroundColor Gray

            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $errors += "$($_.FullName): $($parseErrors[0].Message)"
              Write-Host "  ERROR: $($parseErrors[0].Message)" -ForegroundColor Red
            }
          }

          if ($errors.Count -gt 0) {
            Write-Host "`nFound $($errors.Count) syntax error(s):" -ForegroundColor Yellow
            $errors | ForEach-Object { Write-Host "  $_" }
            Write-Host "`nSyntax validation found $($errors.Count) error(s). Failing the pipeline." -ForegroundColor Red
            exit 1
          } else {
            Write-Host "`nAll scripts have valid PowerShell syntax!" -ForegroundColor Green
          }

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [analyze, syntax-check]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          echo "=== Validation Summary ==="
          echo "PSScriptAnalyzer: ${{ needs.analyze.result }} (gating - fails on errors)"
          echo "Syntax Check: ${{ needs.syntax-check.result }} (gating - fails on errors)"
          echo ""
          echo "✓ All validation jobs completed!"
