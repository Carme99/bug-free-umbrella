name: Validate PowerShell Scripts

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          # Keep PSGallery Untrusted; install only the required module for the current user
          Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $scriptsPath = './scripts'

          if (-not (Test-Path $scriptsPath)) {
            Write-Host "Scripts path '$scriptsPath' does not exist. Nothing to analyze." -ForegroundColor Yellow
            exit 0
          }

          # Show module version
          try {
            $mod = Get-Module -ListAvailable PSScriptAnalyzer | Sort-Object Version -Descending | Select-Object -First 1
            if ($mod) { Write-Host "PSScriptAnalyzer version: $($mod.Version)" -ForegroundColor Gray }
          } catch {
            Write-Host "Failed to get module version: $($_.Exception.Message)" -ForegroundColor Yellow
          }

          # Run analyzer with curated settings from .vscode
          Write-Host "Running PSScriptAnalyzer with curated settings (.vscode/PSScriptAnalyzerSettings.psd1)..." -ForegroundColor Cyan

          # Curated settings contract: local .vscode/PSScriptAnalyzerSettings.psd1 and CI must stay in sync on this.
          $psaSettings = './.vscode/PSScriptAnalyzerSettings.psd1'
          if (-not (Test-Path $psaSettings)) {
            Write-Host "Settings file '$psaSettings' not found. Cannot run analyzer." -ForegroundColor Red
            exit 1
          }

          $invokeArgs = @{
            Path = $scriptsPath
            Recurse = $true
            Settings = $psaSettings
          }

          try {
            $results = Invoke-ScriptAnalyzer @invokeArgs -ErrorAction Stop
          } catch {
            Write-Host "Invoke-ScriptAnalyzer failed: $($_.Exception.Message)" -ForegroundColor Red
            $_.Exception | Format-List * -Force

            # Fall back to per-file analysis
            Write-Host "`nFalling back to per-file analysis..." -ForegroundColor Yellow
            $files = Get-ChildItem -Path $scriptsPath -Filter *.ps1 -Recurse
            $allResults = @()
            foreach ($f in $files) {
              try {
                Write-Host "Analyzing: $($f.FullName)" -ForegroundColor Gray
                $r = Invoke-ScriptAnalyzer -Path $f.FullName -Settings $psaSettings -ErrorAction Stop
                if ($r) { $allResults += $r }
              } catch {
                Write-Host "ERROR analyzing $($f.FullName): $($_.Exception.Message)" -ForegroundColor Red
                Write-Host "Skipping this file and continuing..." -ForegroundColor Yellow
                # Don't throw - just continue to next file
              }
            }
            $results = $allResults
          }

          # Handle results (null/empty-safe) - GATING: fail on any Error severity
          if ($null -ne $results -and $results.Count -gt 0) {
            $results | Format-Table -AutoSize
            Write-Host "`nPSScriptAnalyzer found $($results.Count) issue(s)" -ForegroundColor Yellow

            $errors = $results | Where-Object Severity -eq 'Error'
            $warnings = $results | Where-Object Severity -eq 'Warning'

            Write-Host "Errors: $($errors.Count)" -ForegroundColor Yellow
            Write-Host "Warnings: $($warnings.Count)" -ForegroundColor Yellow

            if ($errors.Count -gt 0) {
              Write-Host "`nShowing first 10 errors:" -ForegroundColor Yellow
              $errors | Select-Object -First 10 | Format-Table RuleName, ScriptName, Line, Message -AutoSize
              Write-Host "PSScriptAnalyzer found $($errors.Count) error(s). Failing the pipeline." -ForegroundColor Red
              exit 1
            }
          } else {
            Write-Host "No issues found by PSScriptAnalyzer!" -ForegroundColor Green
          }

      - name: Enforce policy rules (settings of record)
        shell: pwsh
        run: |
          # Policy of record: .vscode/PSScriptAnalyzerSettings.psd1 (same file the
          # curated analyzer step uses). The documented bar is zero Error-severity
          # findings across ./scripts; warnings are reported but need no gate.
          $psaSettings = './.vscode/PSScriptAnalyzerSettings.psd1'
          if (-not (Test-Path $psaSettings)) {
            Write-Host "Settings file '$psaSettings' not found. Cannot enforce policy." -ForegroundColor Red
            exit 1
          }

          $policyFindings = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings $psaSettings
          $policyErrors   = @($policyFindings | Where-Object Severity -eq 'Error')
          $policyWarnings = @($policyFindings | Where-Object Severity -eq 'Warning')
          Write-Host "Policy enforcement: $($policyErrors.Count) error(s), $($policyWarnings.Count) warning(s)." -ForegroundColor Gray
          if ($policyErrors.Count -gt 0) {
            $policyErrors | Format-Table RuleName, ScriptName, Line, Message -AutoSize
            Write-Host "Policy enforcement found $($policyErrors.Count) error(s). Failing the pipeline." -ForegroundColor Red
            exit 1
          }
          Write-Host "Policy enforcement passed (zero errors under settings of record)." -ForegroundColor Green

      - name: Enforce comment-based help (SYNOPSIS presence)
        shell: pwsh
        run: |
          $missing = @()
          Get-ChildItem -Path ./scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $content = Get-Content -LiteralPath $_.FullName -Raw
            if ($content -and $content -notmatch '\.SYNOPSIS') { $missing += $_.FullName }
          }
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Host "MISSING .SYNOPSIS: $_" -ForegroundColor Red }
            Write-Host "$($missing.Count) script(s) missing comment-based help. Failing the pipeline." -ForegroundColor Red
            exit 1
          }
          Write-Host "Comment-based help present in all scripts." -ForegroundColor Green

      - name: Upload Analysis Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pssa-results
          path: |
            *.sarif
            *.xml

  syntax-check:
    name: PowerShell Syntax Validation
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate PowerShell Syntax
        shell: pwsh
        run: |
          $errors = @()

          Get-ChildItem -Path ./scripts -Filter *.ps1 -Recurse | ForEach-Object {
            Write-Host "Checking: $($_.FullName)" -ForegroundColor Gray

            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $errors += "$($_.FullName): $($parseErrors[0].Message)"
              Write-Host "  ERROR: $($parseErrors[0].Message)" -ForegroundColor Red
            }
          }

          if ($errors.Count -gt 0) {
            Write-Host "`nFound $($errors.Count) syntax error(s):" -ForegroundColor Yellow
            $errors | ForEach-Object { Write-Host "  $_" }
            Write-Host "`nSyntax validation found $($errors.Count) error(s). Failing the pipeline." -ForegroundColor Red
            exit 1
          } else {
            Write-Host "`nAll scripts have valid PowerShell syntax!" -ForegroundColor Green
          }

  test:
    name: Pester Tests
    runs-on: ubuntu-latest

    # Outcome of the module smoke step, consumed by the summary job as a merge gate
    # (the test job gates: summary fails if Pester reports any failure).
    outputs:
      module_smoke: ${{ steps.module_smoke.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Pester
        shell: pwsh
        run: |
          # Pin to the version the suite is developed and verified against.
          # Unpinned installs drift onto Pester 6.x, which fails whole Describes
          # on control-flow that 5.x tolerates (e.g. escaping break/continue).
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
          $mod = Get-Module -ListAvailable Pester | Sort-Object Version -Descending | Select-Object -First 1
          Write-Host "Pester version: $($mod.Version)" -ForegroundColor Gray

      - name: Run Pester Tests
        shell: pwsh
        run: |
          if (-not (Test-Path './Tests/Pester.Config.psd1')) {
            Write-Host "Pester config not found at ./Tests/Pester.Config.psd1 — skipping" -ForegroundColor Yellow
            exit 0
          }
          $config = Import-PowerShellDataFile -Path ./Tests/Pester.Config.psd1
          $pesterConfig = New-PesterConfiguration -Hashtable $config
          # Gating: the pipeline FAILS if any Pester test fails.
          # Coverage is collected (CodeCoverage.xml) but not threshold-enforced; the enforced
          # coverage contract is per-script test presence (100% mirrored), not line percentage.
          Write-Host "Invoking Pester with config from Tests/Pester.Config.psd1..." -ForegroundColor Cyan
          $result = Invoke-Pester -Configuration $pesterConfig
          Write-Host "Pester completed: Passed=$($result.PassedCount) Failed=$($result.FailedCount) Skipped=$($result.SkippedCount) Total=$($result.TotalCount)" -ForegroundColor Cyan
          if ($result.FailedCount -gt 0) {
            Write-Host "::error::Pester found $($result.FailedCount) failed test(s)." -ForegroundColor Red
            exit 1
          }
          Write-Host "All Pester tests passed!" -ForegroundColor Green

      - name: Enforce per-script test mirror (gating)
        shell: pwsh
        run: |
          $missing = @(Get-ChildItem -Recurse scripts -Filter *.ps1 |
            Where-Object { $_.Name -notlike '*.Tests.ps1' } | ForEach-Object {
              $rel = [IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName) -replace '\.ps1$', '.Tests.ps1'
              $test = Join-Path 'Tests' ($rel -replace '^scripts[\\/]', '')
              if (-not (Test-Path $test)) { $_.FullName }
            })
          if ($missing.Count -gt 0) {
            Write-Host "::error::Missing mirrored test files:" -ForegroundColor Red
            $missing | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "All scripts have mirrored test files." -ForegroundColor Green

      - name: Module import smoke check (gating)
        id: module_smoke
        shell: pwsh
        run: |
          # Gating: the generated module must import cleanly and expose the full catalog.
          # Pester failures above already fail the job; this check gates via the summary job.
          Import-Module ./src/BugFreeUmbrella -Force -ErrorAction Stop
          $commandCount = (Get-Command -Module BugFreeUmbrella | Measure-Object).Count
          Write-Host "BugFreeUmbrella exported commands: $commandCount" -ForegroundColor Cyan
          if ($commandCount -lt 350) {
            Write-Host "::error::Module smoke check failed: $commandCount exported command(s) < required 350." -ForegroundColor Red
            exit 1
          }
          Write-Host "[+] Module smoke check passed ($commandCount >= 350)." -ForegroundColor Green

      - name: Upload Pester Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pester-results
          path: |
            Tests/TestResults.xml
            Tests/CodeCoverage.xml
          if-no-files-found: warn

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [analyze, syntax-check, test]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          echo "=== Validation Summary ==="
          echo "PSScriptAnalyzer: ${{ needs.analyze.result }} (gating - fails on errors)"
          echo "Syntax Check: ${{ needs.syntax-check.result }} (gating - fails on errors)"
          echo "Pester Tests: ${{ needs.test.result }} (gating - fails on test failures)"
          echo "Module Smoke: ${{ needs.test.outputs.module_smoke }} (gating - module must import with >= 350 commands)"
          echo ""
          if [ "${{ needs.analyze.result }}" != "success" ] || [ "${{ needs.syntax-check.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.test.outputs.module_smoke }}" != "success" ]; then
            echo "❌ One or more gating validation checks failed"
            exit 1
          fi
          echo "✓ All gating validation checks completed!"
