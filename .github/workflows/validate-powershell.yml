name: Validate PowerShell Scripts

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $scriptsPath = './scripts'

          if (-not (Test-Path $scriptsPath)) {
            Write-Host "Scripts path '$scriptsPath' does not exist. Nothing to analyze." -ForegroundColor Yellow
            exit 0
          }

          # Show module version
          try {
            $mod = Get-Module -ListAvailable PSScriptAnalyzer | Sort-Object Version -Descending | Select-Object -First 1
            if ($mod) { Write-Host "PSScriptAnalyzer version: $($mod.Version)" -ForegroundColor Gray }
          } catch {
            Write-Host "Failed to get module version: $($_.Exception.Message)" -ForegroundColor Yellow
          }

          # Run analyzer with DEFAULT rules only (no custom settings)
          # This is lenient and focuses on critical issues
          Write-Host "Running PSScriptAnalyzer with default rules (no custom settings)..." -ForegroundColor Cyan

          $invokeArgs = @{
            Path = $scriptsPath
            Recurse = $true
            Severity = @('Error', 'Warning')
          }

          try {
            $results = Invoke-ScriptAnalyzer @invokeArgs -ErrorAction Stop
          } catch {
            Write-Host "Invoke-ScriptAnalyzer failed: $($_.Exception.Message)" -ForegroundColor Red
            $_.Exception | Format-List * -Force

            # Fall back to per-file analysis
            Write-Host "`nFalling back to per-file analysis..." -ForegroundColor Yellow
            $files = Get-ChildItem -Path $scriptsPath -Filter *.ps1 -Recurse
            $allResults = @()
            foreach ($f in $files) {
              try {
                Write-Host "Analyzing: $($f.FullName)" -ForegroundColor Gray
                $r = Invoke-ScriptAnalyzer -Path $f.FullName -Severity Error,Warning -ErrorAction Stop
                if ($r) { $allResults += $r }
              } catch {
                Write-Host "ERROR analyzing $($f.FullName): $($_.Exception.Message)" -ForegroundColor Red
                $_.Exception | Format-List * -Force
                throw "Analyzer crashed on file $($f.FullName)"
              }
            }
            $results = $allResults
          }

          # Handle results (null/empty-safe) - INFORMATIONAL ONLY, DO NOT FAIL
          if ($null -ne $results -and $results.Count -gt 0) {
            $results | Format-Table -AutoSize
            Write-Host "`nPSScriptAnalyzer found $($results.Count) issue(s)" -ForegroundColor Yellow

            $errors = $results | Where-Object Severity -eq 'Error'
            $warnings = $results | Where-Object Severity -eq 'Warning'

            Write-Host "Errors: $($errors.Count)" -ForegroundColor Yellow
            Write-Host "Warnings: $($warnings.Count)" -ForegroundColor Yellow

            if ($errors.Count -gt 0) {
              Write-Host "`nShowing first 10 errors (informational only):" -ForegroundColor Yellow
              $errors | Select-Object -First 10 | Format-Table RuleName, ScriptName, Line, Message -AutoSize
              Write-Host "NOTE: PSScriptAnalyzer errors are informational and do not block the pipeline" -ForegroundColor Cyan
            }
          } else {
            Write-Host "No issues found by PSScriptAnalyzer!" -ForegroundColor Green
          }

          # Always exit success - PSScriptAnalyzer is informational only
          exit 0

      - name: Upload Analysis Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pssa-results
          path: |
            *.sarif
            *.xml

  test:
    name: Pester Tests
    runs-on: windows-latest
    # Run independently - do not depend on analyze job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Required Modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck

          # Install modules needed for mocking
          Install-Module -Name Microsoft.Graph.Authentication -Force -SkipPublisherCheck -ErrorAction SilentlyContinue
          Install-Module -Name Microsoft.Graph.Users -Force -SkipPublisherCheck -ErrorAction SilentlyContinue

      - name: Run Pester Tests
        shell: pwsh
        run: |
          # Import Pester
          Import-Module Pester -MinimumVersion 5.5.0

          # Load configuration
          $config = Import-PowerShellDataFile -Path ./Tests/Pester.Config.psd1
          $pesterConfig = New-PesterConfiguration -Hashtable $config

          # Run tests
          $result = Invoke-Pester -Configuration $pesterConfig

          # Display results
          Write-Host "`nTest Results:" -ForegroundColor Cyan
          Write-Host "Total: $($result.TotalCount)" -ForegroundColor White
          Write-Host "Passed: $($result.PassedCount)" -ForegroundColor Green
          Write-Host "Failed: $($result.FailedCount)" -ForegroundColor $(if ($result.FailedCount -gt 0) { 'Red' } else { 'Green' })
          Write-Host "Skipped: $($result.SkippedCount)" -ForegroundColor Yellow

          # Fail if tests failed
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) test(s) failed"
          }

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Tests/*.xml

      - name: Upload Code Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: Tests/CodeCoverage.xml

      - name: Comment Test Results on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testResults = fs.existsSync('Tests/TestResults.xml')
              ? fs.readFileSync('Tests/TestResults.xml', 'utf8')
              : 'Test results not found';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Test Results\n\nPester tests completed. Check the workflow artifacts for detailed results.'
            });

  syntax-check:
    name: PowerShell Syntax Validation
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PowerShell Syntax
        shell: pwsh
        run: |
          $errors = @()

          Get-ChildItem -Path ./scripts -Filter *.ps1 -Recurse | ForEach-Object {
            Write-Host "Checking: $($_.FullName)" -ForegroundColor Gray

            try {
              $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content $_.FullName -Raw), [ref]$null)
            }
            catch {
              $errors += "$($_.FullName): $($_.Exception.Message)"
              Write-Host "  ERROR: $($_.Exception.Message)" -ForegroundColor Red
            }
          }

          if ($errors.Count -gt 0) {
            Write-Host "`nFound $($errors.Count) syntax error(s):" -ForegroundColor Red
            $errors | ForEach-Object { Write-Host "  $_" }
            throw "PowerShell syntax validation failed"
          } else {
            Write-Host "`nAll scripts have valid PowerShell syntax!" -ForegroundColor Green
          }

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [analyze, test, syntax-check]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          echo "=== Validation Summary ==="
          echo "PSScriptAnalyzer: ${{ needs.analyze.result }} (informational only)"
          echo "Pester Tests: ${{ needs.test.result }}"
          echo "Syntax Check: ${{ needs.syntax-check.result }}"
          echo ""

          # Only fail if critical jobs fail (syntax-check)
          # PSScriptAnalyzer and Pester tests are informational
          if [[ "${{ needs.syntax-check.result }}" != "success" ]]; then
            echo "CRITICAL: Syntax validation failed"
            exit 1
          fi

          echo "✓ Critical validations passed!"

          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "⚠ Note: Some tests failed (non-blocking)"
          fi
