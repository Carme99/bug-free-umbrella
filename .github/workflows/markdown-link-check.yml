name: Markdown Link Check

on:
  pull_request:
    paths:
      - '**/*.md'
  push:
    branches: [main]
    paths:
      - '**/*.md'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday 06:00 UTC

permissions:
  contents: read

jobs:
  link-check:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check links with lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # lychee args: verbose, no progress, check all markdown, exclude mailto and self-repo transient 404s, tolerate 429
          args: >-
            --verbose --no-progress
            './**/*.md'
            --exclude 'mailto:'
            --exclude 'https://github.com/Carme99/bug-free-umbrella'
            --accept 200,204,206,301,302,303,307,308,429
            --timeout 20
            --max-retries 2
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "### Markdown Link Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.lychee.outcome }}" = "success" ]; then
            echo "✅ No broken links detected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Link check completed with warnings — see lychee output above. (fail: false — not blocking)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Lychee outcome: ${{ steps.lychee.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          fi
